<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patron Sign In — DivyaKala Sacred Pooja Emporium</title>
  <meta name="description" content="Sign in to your DivyaKala Patron Sanctum account to access saved wishlist offerings, X-ray Rudraksha certificates, and express festival muhurta checkout." />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('divyakala_theme') || 'light';
        var d = localStorage.getItem('divyakala_dir') || 'ltr';
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('dir', d);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ivory: '#FFF9EF',
            templeGold: '#C69B45',
            deepMaroon: '#702B32',
            saffron: '#E99A36',
            sandalwood: '#E8D8BF',
            deepBrown: '#49362A'
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-theme-primary text-theme-primary antialiased selection:bg-[#702B32] selection:text-[#FFF9EF] min-h-screen flex flex-col">

  <!-- ========================================================================
       TOP BAR — ACCESSIBILITY CONTROLS ALIGNED TO TOP RIGHT CORNER
       ======================================================================== -->
  <header class="w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 flex justify-end items-center">
    <div class="flex items-center gap-2">
      <button type="button" data-theme-toggle class="w-9 h-9 rounded-full border border-theme bg-theme-surface flex items-center justify-center text-theme-primary hover:border-theme-strong hover:text-brand-gold transition shrink-0" aria-label="Toggle color theme" title="Switch Theme">
        <i data-lucide="sun" class="w-4 h-4 theme-icon-sun hidden text-[#E99A36]"></i>
        <i data-lucide="moon" class="w-4 h-4 theme-icon-moon"></i>
      </button>
      <button type="button" data-rtl-toggle class="w-9 h-9 rounded-full border border-theme bg-theme-surface text-brand-gold hover:border-theme-strong hover:text-brand-gold transition flex items-center justify-center shrink-0" aria-label="Toggle RTL or LTR layout" title="Toggle Right-to-Left Layout">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m16 3 4 4-4 4"></path>
          <path d="M20 7H4"></path>
          <path d="m8 21-4-4 4-4"></path>
          <path d="M4 17h16"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================================================================
       MAIN CONTENT — CENTERED AUTHENTICATION CARD
       ======================================================================== -->
  <main id="main-content" class="flex-1 flex flex-col justify-center py-6 sm:py-10 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-lg mx-auto sacred-card p-6 sm:p-10 shadow-theme-elevated" data-aos="fade-up">

      <!-- Inside Card: Brand Logo + Name Arranged Side-by-Side -->
      <div class="flex items-center justify-center mb-6 pb-6 border-b border-theme text-center">
        <a href="../index.html" class="inline-flex items-center gap-3 group focus:outline-none" aria-label="DivyaKala Return to Store">
          <img src="../assets/images/logo-divyakala.svg" alt="DivyaKala Sacred Kalash Emblem" class="w-10 h-10 sm:w-12 sm:h-12 object-contain transition-transform duration-300 group-hover:scale-105 shrink-0" width="48" height="48" />
          <div class="flex flex-col text-left rtl:text-right">
            <span class="heading-serif text-2xl sm:text-3xl font-bold tracking-tight text-theme-primary leading-tight">DivyaKala</span>
            <span class="text-[9px] uppercase tracking-[0.22em] text-brand-gold font-semibold">Sacred Pooja Emporium</span>
          </div>
        </a>
      </div>

      <!-- Auth Header / Welcome Greeting -->
      <div class="text-center mb-6">
        <span class="sacred-pill">Shubh Pravesh • Member Login</span>
        <h1 class="heading-serif text-2xl sm:text-3xl font-bold text-theme-primary mt-3">Sign In to DivyaKala</h1>
        <p class="text-xs sm:text-sm text-theme-secondary mt-1.5 max-w-sm mx-auto">
          Enter your registered email address and password to access your sacred bag and saved offerings.
        </p>
      </div>

      <!-- Sign In Form -->
      <form id="dk-login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-xs font-bold uppercase tracking-wider text-theme-secondary mb-1.5">Email Address *</label>
          <input id="login-email" name="email" type="email" required placeholder="devotee@domain.com" class="sacred-input" autocomplete="email" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-theme-secondary mb-1.5">Password *</label>
          <div class="relative">
            <input id="login-password" name="password" type="password" required placeholder="Enter your password (min. 6 characters)" class="sacred-input pe-11" autocomplete="current-password" />
            <button type="button" data-toggle-password="login-password" class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-brand-gold hover:text-amber-500 transition focus:outline-none" aria-label="Show password" title="Toggle Password Visibility">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3 text-xs pt-1">
          <label class="inline-flex items-center gap-2 text-theme-secondary cursor-pointer">
            <input type="checkbox" class="rounded border-theme text-[#702B32] focus:ring-[#C69B45]" checked />
            <span>Keep session active</span>
          </label>
          <a href="contact.html#enquiry-form" class="font-semibold text-brand-gold hover:underline">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-sacred-primary w-full py-3.5 mt-2">
          <span>Sign In</span>
        </button>

        <div id="login-form-status" class="hidden" role="status" aria-live="polite"></div>
      </form>

      <!-- Or Continue With Social Login -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-theme"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="bg-theme-surface px-3 text-xs uppercase tracking-wider text-theme-muted font-semibold">Or continue with</span>
        </div>
      </div>

      <!-- Social Icons (Google, Facebook, Apple only) with Hover Effects -->
      <div class="flex items-center justify-center gap-4">
        <button type="button" class="w-12 h-12 rounded-full border border-theme bg-theme-surface hover:border-[#4285F4] hover:bg-[#4285F4]/10 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center text-theme-primary group" aria-label="Sign in with Google" title="Continue with Google">
          <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
        </button>

        <button type="button" class="w-12 h-12 rounded-full border border-theme bg-theme-surface hover:border-[#1877F2] hover:bg-[#1877F2]/10 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center text-theme-primary group" aria-label="Sign in with Facebook" title="Continue with Facebook">
          <svg class="w-5 h-5 text-[#1877F2] fill-current transition-transform duration-200 group-hover:scale-110" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>

        <button type="button" class="w-12 h-12 rounded-full border border-theme bg-theme-surface hover:border-black dark:hover:border-white hover:bg-black/10 dark:hover:bg-white/10 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center text-theme-primary group" aria-label="Sign in with Apple" title="Continue with Apple">
          <svg class="w-5 h-5 fill-current text-theme-primary transition-transform duration-200 group-hover:scale-110" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.36-.58.67-.99 1.74-.88 2.76 1.02.08 2.05-.53 2.61-1.27z"/>
          </svg>
        </button>
      </div>

      <!-- Account Switcher Link -->
      <div class="pt-5 mt-6 border-t border-theme text-center">
        <p class="text-xs sm:text-sm text-theme-secondary">
          New to DivyaKala Emporium?
          <a href="signup.html" class="font-bold text-brand-maroon dark:text-brand-gold hover:underline ml-1">Create Your Account</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
